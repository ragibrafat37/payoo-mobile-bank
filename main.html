<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-800">
    <section class="max-w-md min-h-screen mx-auto py-6 bg-gray-200">
      <header>
        <nav class="flex justify-around items bg-center">
          <img src="assets/Group.png" alt="" />
          <div class="">
            <h1 class="text-3xl font-bold">$ <span id="main-balance">4500</span></h1>
            <p class="border rounded">available balance</p>
          </div>
          <button class="btn btn-primary">Log Out</button>
        </nav>
        <section class="mt-10 p-2">
          <h1 class="text-2xl font-bold mb-2">🔥 Welcome to Payooo!</h1>
          <p>
            Enjoy easy and convenient financial services with us. Cashout charge
            is low and
          </p>
        </section>
        <div class="cards grid grid-cols-3 mt-14 gap-2 p-2">
          <div id="add-money-box" class="box border p-4 text-center rounded-sm">
            <img class="w-8 mx-auto" src="./assets/wallet1.png" alt="" />
            <h3>Add Money</h3>
          </div>
          <div id="cashout-box" class="box border p-4 text-center rounded-sm">
            <img class="w-8 mx-auto" src="./assets/send1.png" alt="" />
            <h3>Cashout</h3>
          </div>
          <div class="box border p-4 text-center rounded-sm">
            <img class="w-8 mx-auto" src="./assets/money1.png" alt="" />
            <h3>Transfer Money</h3>
          </div>
          <div class="box border p-4 text-center rounded-sm">
            <img class="w-8 mx-auto" src="./assets/purse1.png" alt="" />
            <h3>Get Bonus</h3>
          </div>
          <div class="box border p-4 text-center rounded-sm">
            <img class="w-8 mx-auto" src="./assets/purse1.png" alt="" />
            <h3>Pay Bill</h3>
          </div>
          <div class="box border p-4 text-center rounded-sm">
            <img class="w-8 mx-auto" src="./assets/transaction1.png" alt="" />
            <h3>Transaction</h3>
          </div>
        </div>

        <section id="add-money">
          <h2 class="px-8 font-bold">Add Money</h2>
          <div class="">
            <div class="hero-content flex-col lg:flex-row-reverse">
              <div class="card b w-full max-w-sm shrink-0 shadow-2xl">
                <div class="card-body">
                    <legend>Select Bank</legend>
                  <select class="select">
                    <option disabled selected>Select Bank</option>
                    <option value="bkash">Bkash</option>
                    <option value="nagad">Nagad</option>
                    <option value="dbbl">DBBL</option>
                  </select>
              <fieldset class="fieldset">
          <label class="label">Mobile Number</label>
          <input value="01789898989" id="account-number" type="number" class="input" placeholder=" Enter your number" required />
          <label class="label">Amount</label>
          <input id="amount" type="number" class="input" placeholder=" Enter your Amount" required />
          <label class="label">4 Digit Pin</label>
          <input value="1234" id="pin" type="number" class="input" placeholder="Enter 4 Digit Pin" required />
          <div><a class="link link-hover">Forgot password?</a></div>
          <button id="add-money-btn" class="btn btn-neutral border-none bg-blue-700 mt-4">Add Money</button>
        </fieldset>
                </div>
              </div>
            </div>
          </div>
        </section>
        
        <section id="cashout">
          <h2 class="px-8 font-bold">CashOut</h2>
          <div class="">
            <div class="hero-content flex-col lg:flex-row-reverse">
              <div class="card b w-full max-w-sm shrink-0 shadow-2xl">
                <div class="card-body">
                    <legend>Select Bank</legend>
                  <select class="select">
                    <option disabled selected>Select Bank</option>
                    <option value="bkash">Bkash</option>
                    <option value="nagad">Nagad</option>
                    <option value="dbbl">DBBL</option>
                  </select>
              <fieldset class="fieldset">
          <label class="label">Mobile Number</label>
          <input value="01789898989" id="account-number" type="number" class="input" placeholder=" Enter your number" required />
          
          <label class="label">Amount</label>
          <input id="cashout-amount" type="number" class="input" placeholder=" Enter your Amount" required />
          <label class="label">4 Digit Pin</label>
          <input value="1234" id="cashout-pin" type="number" class="input" placeholder="Enter 4 Digit Pin" required />
          <div><a class="link link-hover">Forgot password?</a></div>
          <button id="cashout-btn" class="btn btn-neutral border-none bg-blue-700 mt-4">Cash Out</button>
        </fieldset>
                </div>
              </div>
            </div>
          </div>
        </section>

      </header>
    </section>
    <script src="script/addMoney.js"></script>
    <script src="script/toggle.js"></script>
    <script src="script/cashout.js"></script>

  </body>
</html>
